services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/licensedb?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      HMAC_SECRET: "${HMAC_SECRET:-change-me-in-production}"
      ADMIN_API_KEY: "${ADMIN_API_KEY:-santori}"
      RATE_LIMIT_RPS: "100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: licensedb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5434:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
