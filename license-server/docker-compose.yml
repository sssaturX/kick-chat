services:
  app:
    build: .
    ports:
      - "8000:8000"
    # Do not use env_file for the whole .env: DATABASE_URL=...@localhost would enter the container;
    # inside Docker, localhost is the app container, not Postgres. Only listed ${VAR}s are read from `.env`.
    environment:
      PORT: "8000"
      DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/licensedb?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      HMAC_SECRET: "${HMAC_SECRET}"
      ADMIN_API_KEY: "${ADMIN_API_KEY}"
      RATE_LIMIT_RPS: "${RATE_LIMIT_RPS:-100}"
      ADMIN_SESSION_TTL: "${ADMIN_SESSION_TTL:-24h}"
      ADMIN_COOKIE_SECURE: "${ADMIN_COOKIE_SECURE:-false}"
      # Фиксированные пути: пустой DOWNLOAD_* в .env иначе затирал бы дефолт и отключал /download (404).
      DOWNLOAD_FILE_PATH: "/data/releases/SaturX-release.zip"
      DOWNLOAD_FILE_NAME: "SaturX-Windows.zip"
    volumes:
      - ./releases:/data/releases:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: licensedb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5434:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
